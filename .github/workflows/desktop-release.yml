name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name (e.g. v1.0.1)'
        required: false
        default: 'v1.0.1'
        type: string
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'

permissions:
  contents: write

jobs:
  build:
    name: CWord ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            rust-target: ''
            args: '--bundles nsis'
          - name: macos-arm64
            os: macos-latest
            rust-target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin --bundles dmg'
          - name: macos-x64
            os: macos-latest
            rust-target: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin --bundles dmg'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Setup Rust
        if: matrix.rust-target == ''
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust target
        if: matrix.rust-target != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Install frontend dependencies
        working-directory: docx-editor
        run: bun install --frozen-lockfile

      - name: Build frontend assets
        working-directory: docx-editor
        run: bun run build:demo

      - name: Build desktop bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri
          tauriScript: cargo tauri
          args: ${{ matrix.args }}
          tagName: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || 'v1.0.2' }}
          releaseName: ${{ format('CWord {0}', inputs.tag || github.ref_name) }}
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          releaseAssetNamePattern: CWord-[platform]-[arch]-[bundle][ext]
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: CWord-${{ matrix.name }}-[bundle]
